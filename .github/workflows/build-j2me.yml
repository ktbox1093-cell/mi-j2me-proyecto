name: Build J2ME App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 8)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Crear directorios y descargar preverify de respaldo
      run: |
        echo "Creando estructura de directorios para WTK..."
        mkdir -p wtk/bin
        
        # Descarga directa del binario preverify compatible con Linux desde un mirror estable
        curl -sL https://github.com/hex007/j2me-wtk-bin/raw/master/bin/preverify -o wtk/bin/preverify
        
        # Dar permisos de ejecución
        chmod +x wtk/bin/preverify
        ls -la wtk/bin/

    - name: Crear directorios de compilación
      run: |
        mkdir -p build/classes
        mkdir -p build/preverified
        mkdir -p dist

    - name: Compilar código fuente (Java 1.3)
      run: |
        echo "Compilando clases usando lib/ locales..."
        javac -source 1.3 -target 1.3 \
              -bootclasspath lib/cldcapi11-2.0.4.jar:lib/midp-2.0.4.jar \
              -d build/classes \
              $(find src -name "*.java")

    - name: Preverificar bytecode (Preverify)
      run: |
        echo "Ejecutando preverify local..."
        wtk/bin/preverify \
          -classpath lib/cldcapi11-2.0.4.jar:lib/midp-2.0.4.jar \
          -d build/preverified \
          build/classes

    - name: Empaquetar JAR y generar JAD
      run: |
        echo "Empaquetando JAR..."
        if [ -d "res" ]; then
          cp -r res/* build/preverified/
        fi
        
        jar cfm dist/MiJuego.jar MANIFEST.MF -C build/preverified .
        
        JAR_SIZE=$(wc -c < dist/MiJuego.jar)
        
        echo "MIDlet-Name: MiJuegoJ2ME" > dist/MiJuego.jad
        echo "MIDlet-Version: 1.0.0" >> dist/MiJuego.jad
        echo "MIDlet-Vendor: Desarrollador" >> dist/MiJuego.jad
        echo "MIDlet-Jar-URL: MiJuego.jar" >> dist/MiJuego.jad
        echo "MIDlet-Jar-Size: $JAR_SIZE" >> dist/MiJuego.jad
        echo "MicroEdition-Profile: MIDP-2.0" >> dist/MiJuego.jad
        echo "MicroEdition-Configuration: CLDC-1.1" >> dist/MiJuego.jad

        echo "¡Empaquetado completado con éxito!"

    - name: Subir artefactos (.jar y .jad)
      uses: actions/upload-artifact@v4
      with:
        name: j2me-app-binarios
        path: dist/
